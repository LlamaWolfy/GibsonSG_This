name: Build LaserFocusViz APK

on:
  workflow_dispatch:
  push:
    branches:
      - claude/android-autofocus-laser-viz-3xijv0
    paths:
      - "LaserFocusViz/**"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: LaserFocusViz
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.4

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: laser-focus-viz-debug-apk
          path: LaserFocusViz/app/build/outputs/apk/debug/*.apk

      - name: Publish APK as release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: laser-focus-viz-debug-latest
          name: LaserFocusViz debug build
          body: "Automated debug APK build from commit ${{ github.sha }}."
          files: LaserFocusViz/app/build/outputs/apk/debug/*.apk
